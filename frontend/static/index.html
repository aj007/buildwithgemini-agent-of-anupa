<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriCoach AI</title>
<!-- Optional: used only to draw A2UI Icon components. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --agent-bg: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --chip-bg: #ffffff;
    --input-bg: #ffffff;
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  }

  body.dark-mode {
    --accent: #38bdf8;
    --accent-hover: #7dd3fc;
    --bg: #090d16;
    --card-bg: #0f172a;
    --border: #1e293b;
    --agent-bg: #0f172a;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --chip-bg: #0f172a;
    --input-bg: #0f172a;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  
  header {
    background: var(--card-bg);
    color: var(--text-primary);
    padding: 0.9rem 1.4rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .brand {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent);
  }
  .theme-btn {
    background: var(--bg);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 0.4rem 0.85rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .theme-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }
  .sender-tag {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
    padding-left: 0.2rem;
  }
  .bubble {
    display: inline-block;
    padding: 0.8rem 1.1rem;
    border-radius: 18px;
    background: var(--agent-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.98rem;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    max-width: 100%;
    white-space: normal;
  }

  /* Animated Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.2rem;
  }
  .typing-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  /* Category Filter Tabs & Chips Container */
  .prompt-section {
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    padding: 0.6rem 1.2rem 0.2rem 1.2rem;
  }
  .category-tabs {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding-bottom: 0.4rem;
    margin-bottom: 0.4rem;
    border-bottom: 1px dashed var(--border);
  }
  .cat-tab {
    padding: 0.3rem 0.75rem;
    border-radius: 14px;
    background: transparent;
    color: var(--text-secondary);
    border: none;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .cat-tab.active, .cat-tab:hover {
    background: var(--bg);
    color: var(--accent);
  }

  .quick-prompts {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.3rem;
  }
  .prompt-chip {
    padding: 0.5rem 0.95rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--chip-bg);
    color: var(--text-secondary);
    font-size: 0.86rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease-in-out;
  }
  .prompt-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.9rem 1.2rem 1.2rem 1.2rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    background: var(--input-bg);
    color: var(--text-primary);
    transition: border-color 0.15s ease;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }
  form button {
    padding: 0.75rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.98rem;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  form button:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  /* Stat Grid & Zone Pills */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.75rem;
    margin: 0.6rem 0;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
  }
  .stat-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
  .stat-lbl { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; margin-top: 0.2rem; }

  /* Lightbox Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    max-width: 90vw;
    max-height: 85vh;
    background: var(--card-bg);
    padding: 1rem;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  .modal-content img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 10px;
    object-fit: contain;
  }
  .modal-actions {
    display: flex;
    gap: 0.8rem;
  }
  .modal-btn {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-primary);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.45rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.65rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.45rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.98rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.015); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="brand">🚴‍♂️ TriCoach AI</div>
  <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
</header>

<div id="log">
  <div class="msg agent">
    <span class="sender-tag">TriCoach AI</span>
    <div class="bubble">
      Welcome to <strong>TriCoach AI</strong>! 🏊‍♂️🚴‍♂️🏃‍♂️<br>
      I'm your intelligent multi-sport triathlon training assistant. Ask me to recommend structured workouts, calculate heart rate & power training zones, estimate TSS, or log your training progress.
    </div>
  </div>
</div>

<div class="prompt-section">
  <div class="category-tabs">
    <button class="cat-tab active" data-cat="all">All Prompts</button>
    <button class="cat-tab" data-cat="zones">🎯 HR Zones</button>
    <button class="cat-tab" data-cat="swim">🏊 Swim</button>
    <button class="cat-tab" data-cat="bike">🚴 Bike</button>
    <button class="cat-tab" data-cat="badge">🏆 Badges</button>
  </div>
  <div class="quick-prompts">
    <button type="button" class="prompt-chip" data-cat="zones" data-prompt="What should my target heart rate zone be for a 45-min tempo run if my max HR is 185 bpm?">🎯 Target HR Zones</button>
    <button type="button" class="prompt-chip" data-cat="swim" data-prompt="Show me a structured swim workout for endurance from the catalog.">🏊‍♂️ Endurance Swim Workout</button>
    <button type="button" class="prompt-chip" data-cat="bike" data-prompt="Calculate TSS and pace splits for a 30-minute bike ride at 220 watts.">🚴‍♀️ Calculate Bike TSS</button>
    <button type="button" class="prompt-chip" data-cat="badge" data-prompt="Generate a custom golden finisher badge artwork for completing a triathlon 70.3.">🏆 Generate Milestone Badge</button>
  </div>
</div>

<form id="form">
  <input id="input" placeholder="Ask TriCoach AI..." autocomplete="off" autofocus>
  <button type="submit">Send</button>
</form>

<!-- Lightbox Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal-content">
    <img id="modalImg" src="" alt="Preview">
    <div class="modal-actions">
      <a id="downloadBtn" href="" target="_blank" download class="modal-btn">Download Asset</a>
      <button id="closeModal" class="modal-btn">Close</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeToggle = document.getElementById("themeToggle");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const downloadBtn = document.getElementById("downloadBtn");
const closeModal = document.getElementById("closeModal");

// Dark Mode Toggle & LocalStorage Persistence
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeToggle.textContent = "☀️ Light Mode";
}
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeToggle.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});

// Lightbox Modal Handlers
document.addEventListener("click", (e) => {
  if (e.target.tagName === "IMG" && e.target.classList.contains("a2img")) {
    modalImg.src = e.target.src;
    downloadBtn.href = e.target.src;
    modal.classList.add("active");
  }
});
closeModal.addEventListener("click", () => modal.classList.remove("active"));
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

// Category Tabs Filter
document.querySelectorAll(".cat-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const cat = tab.getAttribute("data-cat");
    document.querySelectorAll(".prompt-chip").forEach(chip => {
      if (cat === "all" || chip.getAttribute("data-cat") === cat) {
        chip.style.display = "inline-block";
      } else {
        chip.style.display = "none";
      }
    });
  });
});

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const tag = el("span", "sender-tag", who === "user" ? "You" : "TriCoach AI");
  m.appendChild(tag);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const m = el("div", "msg agent");
  const tag = el("span", "sender-tag", "TriCoach AI");
  m.appendChild(tag);
  const b = el("div", "bubble");
  b.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return { container: m, bubble: b };
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "TriCoach AI Asset"; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Click listener for quick prompt chips
document.querySelectorAll(".prompt-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.getAttribute("data-prompt");
    form.dispatchEvent(new Event("submit"));
  });
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const typing = showTypingIndicator();
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(typing.bubble, data.parts || []);
  } catch (e) {
    typing.bubble.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
